<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" role="img" aria-label="Bien de tipo cantidad sin imagen">
  <rect width="240" height="200" fill="#ecfdf5"/>
  <circle cx="120" cy="100" r="78" fill="#d1fae5"/>
  <g stroke="#047857" stroke-width="3" stroke-linejoin="round">
    <!-- Caja inferior izquierda -->
    <rect x="62" y="104" width="54" height="46" rx="4" fill="#10b981"/>
    <rect x="80" y="104" width="18" height="16" fill="#a7f3d0"/>
    <!-- Caja inferior derecha -->
    <rect x="124" y="104" width="54" height="46" rx="4" fill="#10b981"/>
    <rect x="142" y="104" width="18" height="16" fill="#a7f3d0"/>
    <!-- Caja superior -->
    <rect x="93" y="54" width="54" height="46" rx="4" fill="#059669"/>
    <rect x="111" y="54" width="18" height="16" fill="#a7f3d0"/>
  </g>
  <!-- Contador de unidades -->
  <circle cx="176" cy="58" r="17" fill="#ffffff" stroke="#047857" stroke-width="3"/>
  <text x="176" y="64" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#047857">#</text>
</svg>
